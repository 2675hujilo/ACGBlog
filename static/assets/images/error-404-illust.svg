<!-- 404 插图：小猫趴在啃坏的纸箱子上，300x200 -->
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="e404Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe0e8"/>
      <stop offset="1" stop-color="#e6dcff"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#e404Bg)"/>
  <!-- 大 404 字 -->
  <text x="150" y="78" font-family="sans-serif" font-size="62" fill="#a06cd5" text-anchor="middle" font-weight="bold" opacity=".85">404</text>
  <!-- 纸箱 -->
  <path d="M110 130 h80 l-8 55 h-64z" fill="#f0d9b5" stroke="#c9a878" stroke-width="3" stroke-linejoin="round"/>
