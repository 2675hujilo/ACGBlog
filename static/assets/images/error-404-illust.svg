    <path d="M138 128 l4 -18 12 6a16 16 0 0 1 6 0l12-6 4 18a20 20 0 0 1 2 10c0 11-9 17-18 17s-18-6-18-17a20 20 0 0 1 2-10z" fill="#fff7fb"/>
  </g>
  <circle cx="148" cy="140" r="3" fill="#5a3d7a"/>
  <circle cx="162" cy="140" r="3" fill="#5a3d7a"/>
  <path d="M152 147 q3 2.5 6 0" stroke="#5a3d7a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="144" cy="146" rx="3.5" ry="2" fill="#ff9ec2" opacity=".7"/>
  <ellipse cx="166" cy="146" rx="3.5" ry="2" fill="#ff9ec2" opacity=".7"/>
  <!-- 纸屑 -->
  <g fill="#c9a8f0" opacity=".7">
    <circle cx="80" cy="120" r="3"/>
    <circle cx="225" cy="130" r="2.5"/>
    <circle cx="215" cy="105" r="2" opacity=".6"/>
  </g>
</svg>
