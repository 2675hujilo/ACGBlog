<!-- 文章封面占位：粉紫蓝渐变，翻开的书本与探头小猫，400x250 -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="250" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="covBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd0e2"/>
      <stop offset=".5" stop-color="#d9c2f5"/>
      <stop offset="1" stop-color="#bcd8ff"/>
    </linearGradient>
    <linearGradient id="covBook" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0e6ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" rx="18" fill="url(#covBg)"/>
  <!-- 装饰闪光 -->
  <g fill="#fff" opacity=".85">
    <path d="M60 55 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path d="M340 60 l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" opacity=".7"/>
    <circle cx="90" cy="180" r="4"/>
    <circle cx="320" cy="170" r="3" opacity=".7"/>
  </g>
  <!-- 书本 -->
  <g>
    <path d="M140 150 q60 -18 120 0v60q-60-18-120 0z" fill="url(#covBook)" stroke="#a06cd5" stroke-width="3" stroke-linejoin="round"/>
    <path d="M200 132v78" stroke="#a06cd5" stroke-width="3"/>
  </g>
  <!-- 小猫探头 -->
  <g stroke="#7a5a9e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M175 118 l5 -22 16 8a26 26 0 0 1 8 0l16-8 5 22a28 28 0 0 1 3 16c0 16-13 26-24 26s-24-10-24-26a28 28 0 0 1 3-16z" fill="#fff7fb"/>
  </g>
  <circle cx="190" cy="132" r="3.5" fill="#5a3d7a"/>
  <circle cx="210" cy="132" r="3.5" fill="#5a3d7a"/>
  <ellipse cx="184" cy="142" rx="4.5" ry="2.5" fill="#ff9ec2" opacity=".7"/>
  <ellipse cx="216" cy="142" rx="4.5" ry="2.5" fill="#ff9ec2" opacity=".7"/>
  <path d="M197 140h6M200 140v3" stroke="#5a3d7a" stroke-width="2" stroke-linecap="round"/>
</svg>
