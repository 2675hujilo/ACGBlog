<!-- 加载中插图：转圈的魔法阵 + 坐姿小猫，200x200，CSS 可让外圈旋转 -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="loadBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe6f0"/>
      <stop offset=".5" stop-color="#e6dcff"/>
      <stop offset="1" stop-color="#d4e6ff"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="98" fill="url(#loadBg)"/>
  <!-- 旋转虚线魔法阵（加 loading-spin 类可旋转） -->
  <g class="loading-spin" style="transform-origin:100px 100px">
    <circle cx="100" cy="100" r="78" fill="none" stroke="#a06cd5" stroke-width="3" stroke-dasharray="14 10" stroke-linecap="round" opacity=".6"/>
  </g>
  <!-- 坐姿小猫 -->
  <g stroke="#7a5a9e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 身体 -->
    <ellipse cx="100" cy="135" rx="30" ry="26" fill="#fff7fb"/>
    <!-- 头 -->
    <path d="M78 80 l4 -20 13 7a18 18 0 0 1 10 0l13-7 4 20a24 24 0 0 1 2 12c0 13-11 21-22 21s-22-8-22-21a24 24 0 0 1 2-12z" fill="#fff7fb"/>
    <!-- 尾巴 -->
    <path d="M128 138 q18 2 16 -16" fill="none"/>
  </g>
  <circle cx="92" cy="98" r="3.5" fill="#5a3d7a"/>
  <circle cx="108" cy="98" r="3.5" fill="#5a3d7a"/>
  <ellipse cx="87" cy="107" rx="4" ry="2.5" fill="#ff9ec2" opacity=".7"/>
  <ellipse cx="113" cy="107" rx="4" ry="2.5" fill="#ff9ec2" opacity=".7"/>
  <path d="M97 105h6M100 105v3" stroke="#5a3d7a" stroke-width="2" stroke-linecap="round"/>
  <!-- 闪光 -->
  <g fill="#fff" opacity=".9">
    <path d="M55 60 l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
    <path d="M150 55 l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity=".7"/>
  </g>
</svg>
