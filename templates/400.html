{% load static %}
<!DOCTYPE html>
<html lang="zh-hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="{% static 'assets/js/error_theme_fix.min.js' %}?v={{ BUILD_TOKEN }}"></script>
<link rel="stylesheet" href="{% static 'assets/css/error400.min.css' %}?v={{ BUILD_TOKEN }}">
</head>
<body>
