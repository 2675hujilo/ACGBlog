{% load static %}
<!DOCTYPE html>
<html lang="zh-hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,follow">
{# Bug9 任务2：错误页文案取自后端文案表（{{ MSG.err.* }}），保持全站口径一致 #}
<title>{{ MSG.err.403_title }}</title>
{# 防闪烁脚本：与 base.html 一致，首帧渲染前根据 localStorage/系统偏好设置 data-theme #}
<script src="{% static 'assets/js/error_theme_fix.min.js' %}?v={{ BUILD_TOKEN }}"></script>
<link rel="stylesheet" href="{% static 'assets/css/error403.min.css' %}?v={{ BUILD_TOKEN }}">
</head>
<body>
    <span class="float" aria-hidden="true">🔒</span>
    <span class="float">🚫</span>
    <span class="float">✨</span>
    <span class="float">🔒</span>
    <span class="float">🚫</span>
    <div class="card" role="group" aria-label="权限提示">
        <div class="illust" role="img" aria-label="禁止进入">🚫😾🔒</div>
        <h1>{{ MSG.err.403_heading }}</h1>
        <p class="sub" id="err-desc">{{ MSG.err.403_desc }}</p>
        <p class="sub">{{ MSG.err.403_hint }}</p>
        <a class="btn-home" href="/" aria-label="返回首页">{{ MSG.btn.back_home }}</a>
    </div>
</body>
</html>
