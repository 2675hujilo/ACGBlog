{% extends 'base.html' %}
{# 58. 文章密码保护门：文章设置了访问密码时，输入密码前不展示正文 #}
{% block title %}输入访问密码 · {{ article.title }}{% endblock %}
{% block content %}
<div class="password-gate">
    <div class="pg-card">
        <div class="pg-emoji" aria-hidden="true">🔒</div>
        <h1>这篇文章已上锁啦~</h1>
        <p class="muted">《{{ article.title }}》设置了访问密码，输入密码后即可阅读。</p>
    <form method="post" class="pg-form" aria-label="访问密码表单">
            {% csrf_token %}
<input type="password" name="article_password" placeholder="请输入访问密码…"
                   autocomplete="off" required autofocus aria-label="文章访问密码">
            <button type="submit" class="btn-primary">🔓 解锁阅读</button>
        </form>
        <a href="{% url 'index' %}" class="pg-back" aria-label="返回首页">← 回首页逛逛</a>
    </div>
</div>
{% endblock %}
